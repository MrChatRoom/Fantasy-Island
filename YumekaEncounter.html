
<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yumeka</title>
    <link rel="stylesheet" href="YumekaEncounter.css">
</head>
<body>
    <main class="encounter" id="encounter">
        <button class="language-button" id="languageButton" onclick="switchLanguage()">ENGLISH ♡</button>

        <div class="character">
            <img src="Yumeka.png" alt="Yumeka">
        </div>

        <div class="dialogue">
            <div class="nameplate" id="characterName">ゆめか</div>
            <p id="dialogueText">は、は、はい...</p>
            <button class="next-button" onclick="nextDialogue()">▼</button>
        </div>
    </main>

    <div class="boo-screen" id="booScreen">
        <img src="boo.gif" alt="">
    </div>

    <div class="loading-screen" id="loadingScreen">
        <div class="loading-glow"></div>
        <div class="loading-dialogue">
            <p id="loadingText">読み込み中...</p>
            <div class="loading-dots">
                <span></span>
                <span></span>
                <span></span>
            </div>
            <div class="loading-warning">PLEASE WAIT</div>
        </div>
    </div>

    <audio id="booSound" src="boo.wav" preload="auto"></audio>

    <script>
        let language = "ja";
        let dialogueIndex = 0;
        let hasTriggered = false;

        const dialogue = {
            ja: [
                "は、は、はい...",
                "ひ、久しぶりですね",
                "だ、誰かに会うのは... >_<",
                "ねえ、あなたはどうしますか？",
                "ねえ、あなたの臓器を見てもいいですか？"
            ],
            en: [
                "H-h-hai...",
                "I-it's been a while...",
                "S-since I've seen anyone... >_<",
                "What do you say?",
                "C-CAN I SEE YOUR ORGANS?"
            ]
        };

        function switchLanguage() {
            language = language === "ja" ? "en" : "ja";

            document.getElementById("characterName").textContent =
                language === "en" ? "Yumeka" : "ゆめか";

            document.getElementById("languageButton").textContent =
                language === "en" ? "日本語 ♡" : "ENGLISH ♡";

            updateDialogue();
        }

        function updateDialogue() {
            document.getElementById("dialogueText").textContent =
                dialogue[language][dialogueIndex];
        }

        function nextDialogue() {
            if (hasTriggered) return;

            if (dialogueIndex < dialogue[language].length - 1) {
                dialogueIndex++;
                updateDialogue();
            } else {
                triggerBoo();
            }
        }

        function triggerBoo() {
            if (hasTriggered) return;
            hasTriggered = true;

            document.getElementById("booScreen").classList.add("active");

            const sound = document.getElementById("booSound");
            sound.currentTime = 0;
            sound.volume = 1;
            sound.play().catch(() => {});

            setTimeout(() => {
                document.getElementById("booScreen").classList.remove("active");
                document.getElementById("loadingScreen").classList.add("active");

                const delay = Math.floor(Math.random() * 8001) + 5000;

                setTimeout(() => {
                    window.location.href = "door1.html";
                }, delay);
            }, 1700);
        }
    </script>
</body>
</html>
